[project]
name = "petai-api"
version = "0.1.0"
description = "Petai Pet Runtime — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "anyio==4.15.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "langgraph==1.2.12",
  "langgraph-checkpoint==4.2.0",
  "langgraph-prebuilt==1.1.0",
  "langgraph-sdk==0.4.5",
  "pydantic==2.13.5",
  "pydantic_core==2.46.5",
  "starlette==1.7.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
